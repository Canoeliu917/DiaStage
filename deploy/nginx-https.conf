# Enable only after Certbot has issued one certificate covering both domain names.
# Authentication tokens can appear in paths, queries and Referer headers.
log_format diastage_safe '$remote_addr [$time_local] "$request_method $server_protocol" '
                         '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name diastage.art www.diastage.art;
    access_log /var/log/nginx/access.log diastage_safe;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://diastage.art$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name diastage.art;
    access_log /var/log/nginx/access.log diastage_safe;
    ssl_certificate /etc/letsencrypt/live/diastage.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diastage.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:4329;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl;
    server_name www.diastage.art;
    access_log /var/log/nginx/access.log diastage_safe;
    ssl_certificate /etc/letsencrypt/live/diastage.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diastage.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://diastage.art$request_uri;
}

# ACME only until the verified application release is explicitly approved for public access.
server {
    listen 80;
    server_name diastage.art www.diastage.art;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "DiaStage is being prepared. Please try again later.\n";
    }
}

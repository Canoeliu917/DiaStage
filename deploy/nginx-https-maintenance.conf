# Enable after certificate issuance to validate HTTPS without exposing the application.
server {
    listen 80;
    server_name diastage.art www.diastage.art;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://diastage.art$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name diastage.art www.diastage.art;
    ssl_certificate /etc/letsencrypt/live/diastage.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/diastage.art/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        default_type text/plain;
        return 503 "DiaStage is being prepared. Please try again later.\n";
    }
}
